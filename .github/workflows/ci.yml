name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: beacon
          POSTGRES_PASSWORD: beacon
          POSTGRES_DB: beacon
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U beacon -d beacon"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://beacon:beacon@127.0.0.1:5433/beacon?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Test
        run: go test -p 1 ./...
      - name: Build
        run: |
          VERSION=0.0.0
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
          fi
          COMMIT="$(git rev-parse --short=7 HEAD)"
          DATE="$(TZ=UTC git show -s --format=%cd --date=format:%Y-%m-%dT%H:%MZ HEAD)"
          go build -ldflags "-s -w -X github.com/magiconair/beacon/internal/version.Version=${VERSION} -X github.com/magiconair/beacon/internal/version.Commit=${COMMIT} -X github.com/magiconair/beacon/internal/version.Date=${DATE}" -o /tmp/beacon ./cmd/beacon
      - name: Verify CLA artifacts
        run: ./scripts/verify-cla.sh
      - name: Publish tag calculation
        run: ./scripts/publish-release_test.sh
