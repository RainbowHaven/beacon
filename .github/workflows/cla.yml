# CLA signatures via contributor-assistant/github-action (PR comment signing).
# Prefer this over the unmaintained cla-assistant.io hosted service.
#
# Notes:
# - Do NOT pre-create signatures/version1/cla.json; the action creates it.
# - Signature commits land on `main`. If `main` is protected and blocks
#   GITHUB_TOKEN pushes, add a classic PAT with `repo` scope as the
#   PERSONAL_ACCESS_TOKEN secret (or store signatures on an unprotected branch).
# - The upstream action repo is archived; pin a release tag. Revisit if a
#   maintained fork becomes the community standard.

name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: >-
          (github.event.comment.body == 'recheck'
          || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA')
          || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Uncomment if signature commits to main fail under branch protection:
          # PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/magiconair/beacon/blob/main/CLA.md
          branch: main
          # Owner need not re-sign; bots cannot sign.
          allowlist: magiconair,bot*,dependabot[bot]
          lock-pullrequest-aftermerge: true
          custom-notsigned-prcomment: >-
            Thank you for contributing to Beacon. All contributors must sign the
            [Contributor License Agreement](https://github.com/magiconair/beacon/blob/main/CLA.md)
            so copyright can be held by the project steward and later transferred
            to the NGO and/or relicensed if needed.

            Please reply with exactly:

            I have read the CLA Document and I hereby sign the CLA
          custom-allsigned-prcomment: All contributors have signed the Beacon CLA.
