# Required secrets:
#   RAILWAY_STAGING_TOKEN
#
# Required vars:
#   RAILWAY_PROJECT_ID
#   RAILWAY_STAGING_SERVICE
#   RAILWAY_STAGING_ENVIRONMENT
# Optional vars:
#   STAGING_URL
#
# Staging Railway service must use start command `/app/beacon --wipe-schema`
# and BEACON_ALLOW_SCHEMA_WIPE=true (private DB; wipe happens in-process on boot).
# Turn OFF Railway auto-deploy on staging — this workflow owns it.
name: Staging deploy

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [closed]

concurrency:
  group: staging-deploy
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  deploy-pr:
    name: Deploy PR to staging
    if: >
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != null &&
      contains(github.event.comment.body, '/deploy-staging')
    runs-on: ubuntu-latest
    steps:
      - name: Authorize
        env:
          ASSOCIATION: ${{ github.event.comment.author_association }}
        run: |
          case "$ASSOCIATION" in
            OWNER|MEMBER|COLLABORATOR) echo "ok: $ASSOCIATION" ;;
            *)
              echo "Only OWNER/MEMBER/COLLABORATOR may run /deploy-staging (got $ASSOCIATION)"
              exit 1
              ;;
          esac

      - name: Match slash command
        env:
          BODY: ${{ github.event.comment.body }}
        run: |
          if ! printf '%s\n' "$BODY" | grep -qE '(^|[[:space:]])\/deploy-staging([[:space:]]|$)'; then
            echo "Comment does not contain /deploy-staging as a token; skipping."
            exit 1
          fi

      - name: Resolve PR head
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PR="${{ github.event.issue.number }}"
          META=$(gh api "repos/${{ github.repository }}/pulls/${PR}")
          REPO=$(printf '%s' "$META" | jq -r .head.repo.full_name)
          SHA=$(printf '%s' "$META" | jq -r .head.sha)
          REF=$(printf '%s' "$META" | jq -r .head.ref)
          if [[ "$REPO" != "${{ github.repository }}" ]]; then
            echo "Refusing to deploy a fork ($REPO)."
            exit 1
          fi
          echo "number=$PR" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "Deploying PR #${PR} @ ${SHA}"

      - name: Acknowledge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions" \
            -f content='rocket' || true
          gh pr comment "${{ steps.pr.outputs.number }}" --body \
            "Deploying \`${{ steps.pr.outputs.sha }}\` to staging (in-app schema wipe on boot + Railway deploy)…"

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.pr.outputs.sha }}

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway staging
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_STAGING_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
        run: |
          set -euo pipefail
          SERVICE="${{ vars.RAILWAY_STAGING_SERVICE }}"
          ENV_NAME="${{ vars.RAILWAY_STAGING_ENVIRONMENT }}"
          PROJECT="${{ vars.RAILWAY_PROJECT_ID }}"
          if [[ -z "$SERVICE" || -z "$ENV_NAME" || -z "$PROJECT" ]]; then
            echo "Set repository variables RAILWAY_PROJECT_ID, RAILWAY_STAGING_SERVICE, RAILWAY_STAGING_ENVIRONMENT" >&2
            exit 1
          fi
          if [[ -z "${RAILWAY_TOKEN:-}" ]]; then
            echo "Set repository secret RAILWAY_STAGING_TOKEN" >&2
            exit 1
          fi
          railway up --ci --detach --service "$SERVICE" --environment "$ENV_NAME"

      - name: Comment result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_URL: ${{ vars.STAGING_URL }}
        run: |
          if [[ "${{ job.status }}" == "success" ]]; then
            URL="${STAGING_URL:-staging}"
            gh pr comment "${{ steps.pr.outputs.number }}" --body \
              "**Staging updated** from PR #${{ steps.pr.outputs.number }} @ \`${{ steps.pr.outputs.sha }}\`.

          - Host: ${URL}
          - Container boots with \`--wipe-schema\` (requires \`BEACON_ALLOW_SCHEMA_WIPE=true\` on staging); migrations run afterward. Check logs for bootstrap invite if needed.
          - Staging is shared — a later \`/deploy-staging\` or closing this PR (redeploys \`main\`) will replace this build."
          else
            gh pr comment "${{ steps.pr.outputs.number }}" --body \
              "Staging deploy **failed** for \`${{ steps.pr.outputs.sha }}\`. See the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
          fi

  restore-main:
    name: Restore staging from main
    if: github.event.pull_request && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy main to Railway staging
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_STAGING_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
        run: |
          set -euo pipefail
          SERVICE="${{ vars.RAILWAY_STAGING_SERVICE }}"
          ENV_NAME="${{ vars.RAILWAY_STAGING_ENVIRONMENT }}"
          PROJECT="${{ vars.RAILWAY_PROJECT_ID }}"
          if [[ -z "$SERVICE" || -z "$ENV_NAME" || -z "$PROJECT" ]]; then
            echo "Set repository variables RAILWAY_PROJECT_ID, RAILWAY_STAGING_SERVICE, RAILWAY_STAGING_ENVIRONMENT" >&2
            exit 1
          fi
          if [[ -z "${RAILWAY_TOKEN:-}" ]]; then
            echo "Set repository secret RAILWAY_STAGING_TOKEN" >&2
            exit 1
          fi
          railway up --ci --detach --service "$SERVICE" --environment "$ENV_NAME"

      - name: Comment on PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_URL: ${{ vars.STAGING_URL }}
        run: |
          URL="${STAGING_URL:-staging}"
          if [[ "${{ job.status }}" == "success" ]]; then
            gh pr comment "${{ github.event.pull_request.number }}" --body \
              "PR closed — staging restored to \`main\` (${URL}). Schema wipe + migrate happen on boot."
          else
            gh pr comment "${{ github.event.pull_request.number }}" --body \
              "Failed to restore staging to \`main\`. See the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
          fi
