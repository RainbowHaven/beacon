{{template "layout_start" .}}
<h1>Rename occupant</h1>
{{if .Error}}
<p class="flash error" role="alert">
  {{.Error}}
  {{if .Suggestion}}
  Try
  <input class="nick-suggest" type="text" readonly value="{{.Suggestion}}" onclick="this.select()" aria-label="Suggested nickname">
  {{end}}
</p>
{{end}}
<p class="muted">{{.House.Name}} · nicknames must start with a letter; folded keys are permanently reserved in this house and cannot be reused.</p>
<form class="stack" method="post" action="/occupants/{{.Occupant.ID}}/rename" style="max-width:28rem">
  <label>Nickname
    <input name="nickname" required maxlength="80" autocomplete="off" autocapitalize="words" value="{{.Nickname}}">
  </label>
  <button type="submit">Save nickname</button>
</form>
<p><a href="/occupants">Back</a></p>
{{template "layout_end" .}}
