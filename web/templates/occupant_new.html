{{template "layout_start" .}}
<h1>Add occupant</h1>
{{if .Error}}<p class="flash error">{{.Error}}</p>{{end}}
<p class="muted">Choose the house and arrival date, then hand the device to the resident for the identity step. Legal name and ID never appear on manager screens.</p>
<form class="stack" method="post" action="/occupants/handoff" style="max-width:28rem">
  <label>Safe house
    <select name="safe_house_id" required>
      {{range .Houses}}
      <option value="{{.ID}}">{{.Name}}</option>
      {{end}}
    </select>
  </label>
  <label>Arrival date
    <input type="date" name="arrived_at" value="{{.Today}}" required>
  </label>
  <button type="submit">Hand device to resident</button>
</form>
<p><a href="/occupants">Back</a></p>
{{template "layout_end" .}}
