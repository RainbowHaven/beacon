<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Log in · Beacon</title>
  <link rel="icon" href="../static/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
  <link rel="stylesheet" href="css/daisyui.css">
  <link rel="stylesheet" href="css/beacon.css">
</head>
<body>
  <div class="auth-shell">
    <div class="stack stack-narrow">
      <a class="brand-mark brand-mark-lg" href="index.html">
        <img class="brand-lockup" src="../static/img/rainbow-haven.svg" alt="Rainbow Haven" width="192" height="173">
      </a>
      <h1>Log in</h1>
      <p class="muted">Use the passkey enrolled from your invite link. No passwords.</p>
      <div role="alert" class="alert alert-error" hidden></div>
      <form class="stack" action="#" method="post">
        <label class="form-control">
          <span class="label"><span class="label-text">Email</span></span>
          <input class="input" type="email" name="email" autocomplete="username webauthn" required value="manager@example.com">
        </label>
        <button class="btn btn-primary" type="submit">Sign in with passkey</button>
      </form>
      <p><a href="index.html">Back to mockups</a> · <a href="occupants.html">Skip to app</a></p>
      <button type="button" class="theme-item" data-theme-toggle title="Dark mode" aria-pressed="false">
        <svg class="menu-icon icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        <svg class="menu-icon icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
        <span class="menu-label theme-label-dark">Dark mode</span>
          <span class="menu-label theme-label-light">Light mode</span>
      </button>
      <p class="muted">Beacon</p>
    </div>
  </div>
  <script src="js/theme.js"></script>
</body>
</html>
