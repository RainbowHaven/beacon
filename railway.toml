# Railway service config for Beacon (production defaults).
# Staging: set Pre-deploy command to `/app/beacon wipe-schema` (never on production).
# See deploy/README.md. GitHub auto-deploy stays off; releases use make publish-*.
# Production domain: beacon.magiconair.net

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "/app/beacon server"
healthcheckPath = "/healthz"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
