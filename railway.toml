# Railway service config for Beacon.
# Create the project from this GitHub repo, add a Postgres plugin, then set variables
# (see deploy/.env.example). Custom domain: beacon.magiconair.net

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/healthz"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
