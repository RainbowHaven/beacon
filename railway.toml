# Railway service config for Beacon.
# See deploy/README.md for staging vs production environments and auto-deploy.
# Production domain: beacon.magiconair.net

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/healthz"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
