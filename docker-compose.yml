# Local stack for Beacon. Works with Docker Desktop/OrbStack, or Podman:
#   ./scripts/compose.sh up -d --build
#   ./scripts/compose.sh down -v

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: beacon
      POSTGRES_PASSWORD: beacon
      POSTGRES_DB: beacon
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beacon -d beacon"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - beacon_pg:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      ADDR: ":8080"
      DATABASE_URL: postgres://beacon:beacon@db:5432/beacon?sslmode=disable
      BASE_URL: http://localhost:8080
      SECURE_COOKIES: "false"
      WEBAUTHN_RP_ID: localhost
      WEBAUTHN_RP_DISPLAY_NAME: Beacon
      WEBAUTHN_RP_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
      BOOTSTRAP_ADMIN_EMAIL: rhc@example.com
      # Public key only — export via `make env` / `.env`. Never put the private key here.
      IDENTITY_PUBLIC_KEY_B64: ${IDENTITY_PUBLIC_KEY_B64:?Run make env or export IDENTITY_PUBLIC_KEY_B64}
      IDENTITY_KEY_ID: ${IDENTITY_KEY_ID:-local-dev-1}
      RECEIPT_DIR: /data/receipts
    volumes:
      - beacon_receipts:/data/receipts
    depends_on:
      db:
        condition: service_healthy

volumes:
  beacon_pg:
  beacon_receipts:
